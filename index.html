<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Scarlet Grand — Hotel & Dining</title>
    <script>
      ;(function () {
        try {
          var scheme = localStorage.getItem('hotel-color-scheme')
          if (scheme === 'scarlet-grand' || scheme === 'saffron-garden') {
            document.documentElement.dataset.theme = scheme
          } else {
            document.documentElement.dataset.theme = 'scarlet-grand'
          }
          var mode =
            localStorage.getItem('hotel-color-mode') || localStorage.getItem('hotel-theme')
          if (mode === 'dark') document.documentElement.classList.add('dark')
          else if (mode === 'light') document.documentElement.classList.remove('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
